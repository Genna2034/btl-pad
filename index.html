<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BTL Pad — tappeti sonori per il culto</title>
<meta name="description" content="Pad, effetti e loop per accompagnare la lode dal vivo. Funziona offline.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BTL Pad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="splash">
  <div class="alone"></div>
  <img class="logo" src="/logo.png" alt="Be the Light">
  <div class="nome">BTL <b>PAD</b></div>
  <div class="sotto">Worship Service</div>
  <div class="barra"><i></i></div>
  <div class="firma">&copy; G.B.</div>
</div>

<div id="app">
  <header>
    <img class="marklogo" src="/logo.png" alt=""><div class="mark">BTL <b>PAD</b></div>
    <div class="now">
      <span class="k" id="nowK">—</span>
      <span class="sub" id="nowS">nessuna tonalità</span>
    </div>
    <div class="sp"></div>
    <div id="diag">spento</div>
    <div class="bar">
      <button class="b" id="lib">set</button>
      <button class="b" id="wake">schermo</button>
      <button class="b" id="stop">dissolvi</button>
      <button class="b rd" id="panic">stop</button>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="card">
        <div class="pw">
          <button id="power" aria-label="Accendi">
            <svg viewBox="0 0 24 24"><path d="M12 3.2v9.1"/><path d="M6.2 6.4a8.2 8.2 0 1 0 11.6 0"/></svg>
          </button>
          <div class="t">
            <div class="a" id="pwA">Accendi</div>
            <div class="c" id="pwC">tocca per iniziare</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="seg" id="mode">
          <button data-m="0" class="on">Maggiore</button>
          <button data-m="1">Minore</button>
        </div>
        <div class="kg" id="kg"></div>
      </div>

      <div class="card">
        <span class="l">Timbro</span>
        <div class="patch" id="patch"></div>
      </div>

      <div class="card">
        <div class="fad"><span class="n">Pad</span><input type="range" id="pv" min="0" max="100" value="76"><span class="p" id="pvV">76</span></div>
        <div class="fad"><span class="n">Spazio</span><input type="range" id="rv" min="0" max="100" value="62"><span class="p" id="rvV">62</span></div>
        <div class="fad"><span class="n">Dissolv</span><input type="range" id="fd" min="10" max="140" value="45"><span class="p" id="fdV">4.5</span></div>
      </div>
    </section>

    <section class="center">
      <div class="bank">
        <span class="l">Banco</span>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="mix" id="mix"></div>
    </section>
  </main>
</div>

<div id="aurora"><div id="a1"></div><div id="a2"></div><div id="a3"></div></div>
<div id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
